<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRABOR — Test chuyển khoản SePay</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',Arial,sans-serif; }
  body { background:#f5f5f5; min-height:100vh; display:flex; justify-content:center; padding:24px 12px; }
  .card { background:#fff; border-radius:16px; box-shadow:0 4px 20px rgba(0,0,0,.08); max-width:420px; width:100%; overflow:hidden; height:fit-content; }
  .head { background:linear-gradient(135deg,#E8504A,#c93d37); color:#fff; padding:22px; text-align:center; }
  .head h1 { font-size:1.25rem; }
  .head p { font-size:.8rem; opacity:.85; margin-top:4px; }
  .body { padding:22px; }
  label { display:block; font-size:.8rem; font-weight:700; color:#555; margin-bottom:6px; }
  input[type=number] { width:100%; padding:13px 14px; border:1.5px solid #e3e3e3; border-radius:10px; font-size:1.15rem; font-weight:800; color:#E8504A; outline:none; transition:border .2s; }
  input[type=number]:focus { border-color:#E8504A; }
  .hint { font-size:.72rem; color:#999; margin-top:5px; }
  button.primary { width:100%; margin-top:16px; padding:14px; background:#E8504A; color:#fff; border:none; border-radius:10px; font-size:1rem; font-weight:800; cursor:pointer; transition:.2s; }
  button.primary:hover { background:#d43f39; }
  button.primary:disabled { opacity:.6; cursor:not-allowed; }
  .qr-wrap { text-align:center; margin-top:20px; display:none; }
  .qr-wrap img { width:240px; height:240px; border-radius:12px; border:1px solid #eee; }
  .amount-big { font-size:1.6rem; font-weight:900; color:#E8504A; margin:10px 0 2px; }
  .ref-row { display:flex; align-items:center; justify-content:center; gap:8px; margin-top:8px; }
  .ref-box { background:#f0f0f0; padding:8px 14px; border-radius:8px; font-family:monospace; font-weight:800; letter-spacing:1px; }
  .copy-btn { background:#E8504A; color:#fff; border:none; border-radius:6px; padding:7px 12px; font-size:.75rem; font-weight:700; cursor:pointer; }
  .bank { margin-top:14px; background:#fafafa; border-radius:10px; padding:12px; font-size:.82rem; text-align:left; }
  .bank div { display:flex; justify-content:space-between; padding:3px 0; }
  .bank span:first-child { color:#888; } .bank span:last-child { font-weight:700; color:#333; }
  .status { margin-top:18px; padding:14px; border-radius:10px; font-weight:700; font-size:.9rem; display:none; align-items:center; justify-content:center; gap:8px; }
  .status.waiting { display:flex; background:#FFF6E5; color:#B8860B; }
  .status.ok { display:flex; background:#E8F8EF; color:#1E8449; flex-direction:column; gap:4px; }
  .spinner { width:16px; height:16px; border:2.5px solid #B8860B33; border-top-color:#B8860B; border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .err { color:#E74C3C; font-size:.85rem; margin-top:10px; text-align:center; display:none; }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <h1>🧪 Test chuyển khoản SePay</h1>
    <p>Tạo QR chuyển khoản tối thiểu 1.000đ — hệ thống tự xác nhận</p>
  </div>
  <div class="body">
    <label>Số tiền (VNĐ)</label>
    <input type="number" id="amount" placeholder="1000" min="1000" step="1000" value="1000">
    <div class="hint">Tối thiểu 1.000đ · Tối đa 50.000.000đ · Tiền thật, chuyển thật 😄</div>
    <button class="primary" id="createBtn" onclick="createQr()">Tạo mã QR thanh toán</button>
    <div class="err" id="err"></div>

    <div class="qr-wrap" id="qrWrap">
      <img id="qrImg" alt="QR SePay">
      <div class="amount-big" id="amountBig"></div>
      <div style="font-size:.78rem;color:#888">Chuyển khoản với NỘI DUNG chính xác bên dưới:</div>
      <div class="ref-row">
        <span class="ref-box" id="refBox"></span>
        <button class="copy-btn" onclick="copyRef()">Copy</button>
      </div>
      <div class="bank" id="bankInfo"></div>

      <div class="status waiting" id="stWaiting"><span class="spinner"></span> Đang chờ chuyển khoản... (tự kiểm tra 4s/lần)</div>
      <div class="status ok" id="stOk">✅ Đã nhận tiền! Webhook SePay hoạt động hoàn hảo.<span id="okDetail" style="font-size:.8rem;font-weight:400"></span></div>
    </div>
  </div>
</div>
<script>
let pollTimer = null;
const $ = id => document.getElementById(id);

async function createQr() {
  const amount = parseInt($('amount').value);
  const err = $('err'); err.style.display = 'none';
  if (!amount || amount < 1000) { err.textContent = 'Số tiền tối thiểu 1.000đ'; err.style.display = 'block'; return; }
  $('createBtn').disabled = true; $('createBtn').textContent = 'Đang tạo...';
  try {
    const r = await fetch('/api/sepay/testpay/create', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ amount })
    });
    const d = await r.json();
    if (!d.success) throw new Error(d.message || 'Lỗi tạo QR');
    $('qrImg').src = d.qrUrl;
    $('amountBig').textContent = Number(d.amount).toLocaleString('vi-VN') + 'đ';
    $('refBox').textContent = d.ref;
    $('bankInfo').innerHTML =
      '<div><span>Ngân hàng</span><span>' + d.bank.bankName + '</span></div>' +
      '<div><span>Số TK</span><span>' + d.bank.accountNo + '</span></div>' +
      '<div><span>Chủ TK</span><span>' + d.bank.accountName + '</span></div>';
    $('qrWrap').style.display = 'block';
    $('stOk').style.display = 'none';
    $('stWaiting').style.display = 'flex';
    if (pollTimer) clearInterval(pollTimer);
    let elapsed = 0;
    pollTimer = setInterval(async () => {
      elapsed += 4;
      try {
        const s = await fetch('/api/sepay/testpay/status/' + d.ref).then(x => x.json());
        if (s.success && s.status === 'paid') {
          clearInterval(pollTimer);
          $('stWaiting').style.display = 'none';
          $('stOk').style.display = 'flex';
          $('okDetail').textContent = 'Nhận: ' + Number(s.paidAmount).toLocaleString('vi-VN') + 'đ · ' + new Date(s.paidAt).toLocaleTimeString('vi-VN');
        }
      } catch(_) {}
      if (elapsed > 600) { clearInterval(pollTimer); $('stWaiting').innerHTML = '⏰ Quá 10 phút chưa nhận được tiền.'; }
    }, 4000);
  } catch(e) {
    err.textContent = e.message; err.style.display = 'block';
  } finally {
    $('createBtn').disabled = false; $('createBtn').textContent = 'Tạo mã QR thanh toán';
  }
}

function copyRef() {
  navigator.clipboard.writeText($('refBox').textContent);
  event.target.textContent = 'Đã copy ✓';
  setTimeout(() => event.target && (event.target.textContent = 'Copy'), 1500);
}
</script>
</body>
</html>
