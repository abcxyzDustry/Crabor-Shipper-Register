<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>CRABOR — Đang quay lại app...</title>
<style>body{font-family:Arial;background:#E8504A;color:#fff;display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
.c{text-align:center}h2{font-size:1.2rem}.s{font-size:.85rem;opacity:.85;margin-top:8px}</style></head>
<body><div class="c"><h2>Xác thực thành công!</h2><div class="s">Đang quay lại ứng dụng CRABOR...</div>
<div class="s" id="manual" style="display:none;margin-top:16px;background:rgba(255,255,255,.15);padding:12px;border-radius:10px"></div></div>
<script>
(function(){
  const h = new URLSearchParams(location.hash.slice(1));
  const idToken = h.get('id_token');
  const state   = h.get('state');
  if (!idToken || !state) {
    document.querySelector('h2').textContent = '⚠ Thiếu thông tin xác thực';
    return;
  }
  const back = state + '#id_token=' + encodeURIComponent(idToken);
  setTimeout(() => { location.replace(back); }, 600);
  setTimeout(() => {
    const m = document.getElementById('manual');
    m.style.display = 'block';
    m.innerHTML = 'Nếu app không tự mở, quay lại ứng dụng CRABOR trên điện thoại —<br>đăng nhập đã được ghi nhận tự động.';
  }, 2500);
})();
</script>
</body>
</html>
